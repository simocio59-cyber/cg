<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Vidéothèque</title>
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--txt:#e8e8e8;--muted:#9aa0a6;--accent:#01b4e4;--danger:#e5484d}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt)}
  .hidden{display:none!important}
  input,button,select{font:inherit;border-radius:8px;border:1px solid #333;padding:8px 12px;background:#20242c;color:var(--txt)}
  button{cursor:pointer;background:var(--accent);border:none;color:#000;font-weight:600}
  button:disabled{opacity:.6;cursor:default}
  button.secondary{background:#2c313a;color:var(--txt)}
  button.danger{background:var(--danger);color:#fff}
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{background:var(--card);padding:28px;border-radius:14px;width:min(360px,100%);display:flex;flex-direction:column;gap:16px}
  .box h1{margin:0;text-align:center;font-size:1.4rem}
  .box form{display:flex;flex-direction:column;gap:10px}
  .box label{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
  details summary{cursor:pointer;color:var(--muted);font-size:.85rem;margin-bottom:10px}
  .error{color:var(--danger);text-align:center;min-height:1.2em;margin:0;font-size:.9rem}
  header{padding:16px 24px;background:#0b0d10;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10}
  header h1{font-size:1.3rem;margin:0 auto 0 0}
  #searchForm{display:flex;gap:8px;flex-wrap:wrap}
  #yearInput{width:90px}
  main{padding:24px}
  h2{font-size:1.1rem;color:var(--muted);display:flex;align-items:center;gap:10px}
  /* ===== Gros onglets ===== */
  .tabs{display:flex;justify-content:center;gap:16px;margin:8px 0 24px;flex-wrap:wrap}
  .tab{flex:1;max-width:280px;min-width:140px;font-size:1.3rem;padding:18px 24px;border-radius:14px;
       background:#2c313a;color:var(--txt);border:2px solid transparent;
       display:flex;align-items:center;justify-content:center;gap:10px;transition:all .15s}
  .tab:hover{border-color:var(--accent)}
  .tab.active{background:var(--accent);color:#000;transform:scale(1.04)}
  .count{font-size:.8rem;background:rgba(0,0,0,.35);color:inherit;padding:2px 10px;border-radius:10px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  #filterText{flex:1;min-width:200px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-bottom:32px}
  .card{background:var(--card);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s}
  .card:hover{transform:translateY(-3px)}
  .card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#222;display:block}
  .info{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
  .title{font-weight:600;font-size:.9rem}
  .year{color:var(--muted);font-size:.8rem}
  .badge{font-size:.7rem;background:#2c313a;color:var(--accent);padding:2px 6px;border-radius:6px;margin-left:4px}
  .trailerBtn{padding:6px;font-size:.8rem}
  .actions{display:flex;gap:6px;margin-top:auto}
  .actions button{flex:1;padding:6px;font-size:.8rem}
  .link{font-size:.85rem;color:var(--accent);text-decoration:none}
  .link:hover{text-decoration:underline}
  dialog{background:var(--card);color:var(--txt);border:none;border-radius:12px;padding:20px;width:min(420px,90vw)}
  dialog::backdrop{background:rgba(0,0,0,.75)}
  dialog form{display:flex;flex-direction:column;gap:12px}
  dialog label{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
  #trailerDialog{width:min(900px,95vw);padding:12px}
  .video{width:100%;aspect-ratio:16/9;border:0;border-radius:8px;display:block;background:#000}
  .row{display:flex;gap:8px;justify-content:flex-end}
  .empty{color:var(--muted);text-align:center}
  footer{padding:16px;text-align:center;color:var(--muted);font-size:.75rem}
</style>
</head>
<body>

<!-- ===== Écran de connexion ===== -->
<div id="loginScreen" class="login">
  <div class="box">
    <h1>🎬 Ma Vidéothèque</h1>
    <form id="codeForm">
      <label>Code d'accès
        <input id="code" type="password" required autocomplete="off">
      </label>
      <button>Entrer</button>
    </form>
    <details id="adminBox">
      <summary>Connexion admin</summary>
      <form id="adminForm">
        <input id="email" type="email" placeholder="E-mail" required>
        <input id="pwd" type="password" placeholder="Mot de passe" required>
        <button>Se connecter</button>
      </form>
    </details>
    <p id="loginError" class="error"></p>
  </div>
</div>

<!-- ===== Site ===== -->
<div id="app" class="hidden">
  <header>
    <h1>🎬 Ma Vidéothèque</h1>
    <form id="searchForm" class="admin">
      <select id="type">
        <option value="multi">Tout</option>
        <option value="movie">Films</option>
        <option value="tv">Séries</option>
      </select>
      <input id="query" placeholder="Ajouter depuis TMDB..." required>
      <input id="yearInput" type="number" min="1900" max="2100" placeholder="Année">
      <button>Rechercher</button>
    </form>
    <button class="secondary admin" id="trailersBtn">🎞️ Bandes-annonces</button>
    <button class="secondary admin" id="keyBtn">⚙️ Clé API</button>
    <button class="secondary" id="logoutBtn">🚪 Déconnexion</button>
  </header>

  <main>
    <section id="resultsSection" hidden>
      <h2>Résultats de recherche <button class="secondary" id="closeResults">✕ Fermer</button></h2>
      <div class="grid" id="results"></div>
    </section>

    <section>
      <!-- Gros onglets -->
      <div class="tabs">
        <button class="tab" data-tab="movie">🎬 Films <span class="count" id="countMovie">0</span></button>
        <button class="tab" data-tab="tv">📺 Séries <span class="count" id="countTv">0</span></button>
      </div>

      <div class="toolbar">
        <input id="filterText" type="search" placeholder="🔎 Rechercher dans la collection...">
        <select id="sortBy">
          <option value="recent">Ajout récent</option>
          <option value="title">Titre A → Z</option>
          <option value="new">Année (récent)</option>
          <option value="old">Année (ancien)</option>
        </select>
      </div>
      <div id="collection"></div>
    </section>
  </main>

  <footer>Ce site utilise l'API TMDB mais n'est ni approuvé ni certifié par TMDB.</footer>
</div>

<!-- Fenêtre : lien -->
<dialog id="linkDialog">
  <form id="linkForm">
    <h3 id="dlgTitle" style="margin:0"></h3>
    <label>Lien (URL)
      <input id="linkUrl" type="url" placeholder="https://...">
    </label>
    <label>Texte du lien (optionnel)
      <input id="linkLabel" placeholder="Netflix, critique...">
    </label>
    <label>Bande-annonce YouTube (trouvée automatiquement, modifiable)
      <input id="trailerUrl" placeholder="https://www.youtube.com/watch?v=...">
    </label>
    <div class="row">
      <button type="button" class="secondary" id="cancelLink">Annuler</button>
      <button>Enregistrer</button>
    </div>
  </form>
</dialog>

<!-- Fenêtre : bande-annonce -->
<dialog id="trailerDialog">
  <iframe id="player" class="video" title="Bande-annonce"
    allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  <div class="row" style="margin-top:10px">
    <button class="secondary" id="closeTrailer">✕ Fermer</button>
  </div>
</dialog>

<!-- Fenêtre : clé API -->
<dialog id="keyDialog">
  <form id="keyForm">
    <h3 style="margin:0">Clé API TMDB</h3>
    <label>Colle ta clé API (v3) ou ton jeton d'accès (v4)
      <input id="keyInput" required>
    </label>
    <div class="row">
      <button type="button" class="secondary" id="cancelKey">Annuler</button>
      <button>Enregistrer</button>
    </div>
  </form>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCSXTITQx3oLlVT16Kk2SeACi9_G2gYLo0",
  authDomain: "cgtl-9b100.firebaseapp.com",
  projectId: "cgtl-9b100",
  storageBucket: "cgtl-9b100.firebasestorage.app",
  messagingSenderId: "996683479796",
  appId: "1:996683479796:web:cb66241265ccf93394fca1"
};

const GUEST_EMAIL = 'invite@videotheque.app';

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);

const IMG = 'https://image.tmdb.org/t/p/w342';
const NO_IMG = 'data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300"><rect width="100%" height="100%" fill="#2a2e36"/><text x="50%" y="50%" fill="#777" font-size="20" text-anchor="middle">Pas d\'image</text></svg>');

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const poster = f => f.poster_path ? IMG + f.poster_path : NO_IMG;
const year = f => (f.release_date || '').slice(0, 4);
const badge = f => f.type === 'tv' ? '<span class="badge">Série</span>' : '';
const plain = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();

const norm = (r, type) => ({
  id: r.id, type,
  title: r.title || r.name,
  poster_path: r.poster_path || null,
  release_date: r.release_date || r.first_air_date || ''
});

const ytKey = s => {
  s = (s || '').trim();
  if (!s) return '';
  if (/^[\w-]{11}$/.test(s)) return s;
  const m = s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
  return m ? m[1] : null;
};

let apiKey = localStorage.getItem('tmdbKey') || '';
let films = [], lastResults = [], isAdmin = false, unsub = null;
let current = null, isNew = false;
let tab = localStorage.getItem('tab') === 'tv' ? 'tv' : 'movie';

// ===== Connexion admin visible seulement avec #admin =====
function toggleAdminBox() {
  $('adminBox').classList.toggle('hidden', location.hash !== '#admin');
}
toggleAdminBox();
window.addEventListener('hashchange', toggleAdminBox);

// ---------- Connexion ----------
$('codeForm').onsubmit = async e => {
  e.preventDefault();
  $('loginError').textContent = '';
  const code = $('code').value.trim().toLowerCase();
  try { await signInWithEmailAndPassword(auth, GUEST_EMAIL, code); }
  catch { $('loginError').textContent = 'Code incorrect.'; }
};

$('adminForm').onsubmit = async e => {
  e.preventDefault();
  $('loginError').textContent = '';
  try { await signInWithEmailAndPassword(auth, $('email').value.trim(), $('pwd').value); }
  catch { $('loginError').textContent = 'E-mail ou mot de passe incorrect.'; }
};

$('logoutBtn').onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if (unsub) { unsub(); unsub = null; }
  if (!user) {
    $('app').classList.add('hidden');
    $('loginScreen').classList.remove('hidden');
    $('code').value = ''; $('pwd').value = '';
    return;
  }
  isAdmin = user.email !== GUEST_EMAIL;
  $('loginScreen').classList.add('hidden');
  $('app').classList.remove('hidden');
  document.querySelectorAll('.admin').forEach(el => el.classList.toggle('hidden', !isAdmin));

  unsub = onSnapshot(query(collection(db, 'films'), orderBy('addedAt', 'desc')), snap => {
    films = snap.docs.map(d => ({ ...d.data(), key: d.id }));
    renderCollection();
    if (!$('resultsSection').hidden) renderResults();
  }, err => {
    alert("Accès refusé. Ce compte n'est pas autorisé.");
    signOut(auth);
  });
});

// ---------- API TMDB ----------
async function tmdb(path, params = {}) {
  const url = new URL('https://api.themoviedb.org/3' + path);
  const opts = { headers: {} };
  if (apiKey.startsWith('eyJ')) opts.headers.Authorization = 'Bearer ' + apiKey;
  else url.searchParams.set('api_key', apiKey);
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(r.status === 401 ? 'Clé API invalide.' : 'Erreur TMDB ' + r.status);
  return r.json();
}

async function findTrailer(type, id) {
  if (!apiKey) return '';
  for (const lang of ['fr-FR', 'en-US']) {
    try {
      const vids = (await tmdb(`/${type}/${id}/videos`, { language: lang })).results
        .filter(v => v.site === 'YouTube');
      const pick = vids.find(v => v.type === 'Trailer' && v.official)
                || vids.find(v => v.type === 'Trailer')
                || vids.find(v => v.type === 'Teaser')
                || vids[0];
      if (pick) return pick.key;
    } catch {}
  }
  return '';
}

$('searchForm').onsubmit = async e => {
  e.preventDefault();
  if (!apiKey) return openKeyDialog();
  const type = $('type').value;
  const y = $('yearInput').value.trim();
  const params = { query: $('query').value.trim(), language: 'fr-FR' };
  try {
    if (type === 'movie') {
      if (y) params.primary_release_year = y;
      lastResults = (await tmdb('/search/movie', params)).results.map(r => norm(r, 'movie'));
    } else if (type === 'tv') {
      if (y) params.first_air_date_year = y;
      lastResults = (await tmdb('/search/tv', params)).results.map(r => norm(r, 'tv'));
    } else {
      lastResults = (await tmdb('/search/multi', params)).results
        .filter(r => r.media_type === 'movie' || r.media_type === 'tv')
        .map(r => norm(r, r.media_type));
      if (y) lastResults = lastResults.filter(r => year(r) === y);
    }
    renderResults();
  } catch (err) { alert(err.message); }
};

const isOwned = r => films.some(x => (x.type || 'movie') === r.type && x.id === r.id);

function renderResults() {
  $('resultsSection').hidden = false;
  $('results').innerHTML = lastResults.length ? lastResults.map((f, i) => {
    const owned = isOwned(f);
    return `<div class="card">
      <img src="${poster(f)}" alt="${esc(f.title)}" loading="lazy">
      <div class="info">
        <div class="title">${esc(f.title)}${badge(f)}</div>
        <div class="year">${year(f)}</div>
        <div class="actions">
          <button data-add="${i}" ${owned ? 'disabled' : ''}>${owned ? '✓ Ajouté' : '+ Ajouter'}</button>
        </div>
      </div></div>`;
  }).join('') : '<p class="empty">Aucun résultat. Essaie sans l\'année, avec le titre original, ou change Films/Séries.</p>';
}

$('results').onclick = async e => {
  const btn = e.target.closest('button[data-add]');
  if (!btn) return;
  const f = lastResults[btn.dataset.add];
  btn.disabled = true; btn.textContent = '⏳ ...';
  const trailer = await findTrailer(f.type, f.id);
  btn.disabled = false; btn.textContent = '+ Ajouter';
  openLinkDialog({ ...f, key: `${f.type}-${f.id}`, link: '', label: '', trailer }, true);
};
$('closeResults').onclick = () => $('resultsSection').hidden = true;

// ---------- Onglets Films / Séries ----------
document.querySelectorAll('.tab').forEach(b => {
  b.onclick = () => {
    tab = b.dataset.tab;
    localStorage.setItem('tab', tab);
    renderCollection();
  };
});

// ---------- Collection : recherche, tri, onglets ----------
$('sortBy').value = localStorage.getItem('sortBy') || 'recent';

const sorters = {
  recent: (a, b) => (b.addedAt || 0) - (a.addedAt || 0),
  title:  (a, b) => String(a.title).localeCompare(String(b.title), 'fr', { sensitivity: 'base' }),
  new:    (a, b) => (b.release_date || '').localeCompare(a.release_date || ''),
  old:    (a, b) => (a.release_date || '9999').localeCompare(b.release_date || '9999')
};

function cardHTML(f) {
  const img = `<img src="${poster(f)}" alt="${esc(f.title)}" loading="lazy">`;
  return `<div class="card">
    ${f.link ? `<a href="${esc(f.link)}" target="_blank" rel="noopener">${img}</a>` : img}
    <div class="info">
      <div class="title">${esc(f.title)}</div>
      <div class="year">${year(f)}</div>
      ${f.trailer ? `<button class="secondary trailerBtn" data-trailer="${esc(f.trailer)}">▶ Bande-annonce</button>` : ''}
      ${f.link ? `<a class="link" href="${esc(f.link)}" target="_blank" rel="noopener">🔗 ${esc(f.label || 'Ouvrir le lien')}</a>` : ''}
      ${isAdmin ? `<div class="actions">
        <button class="secondary" data-edit="${esc(f.key)}">✏️ Modifier</button>
        <button class="danger" data-del="${esc(f.key)}">🗑️</button>
      </div>` : ''}
    </div></div>`;
}

function renderCollection() {
  // Onglet actif en bleu
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));

  const q = plain($('filterText').value);
  const list = films.filter(f => !q || plain(f.title).includes(q))
                    .sort(sorters[$('sortBy').value] || sorters.recent);
  const movies = list.filter(f => (f.type || 'movie') === 'movie');
  const shows  = list.filter(f => f.type === 'tv');

  $('countMovie').textContent = movies.length;
  $('countTv').textContent = shows.length;

  const items = tab === 'tv' ? shows : movies;
  const label = tab === 'tv' ? 'série' : 'film';

  if (items.length) {
    $('collection').innerHTML = `<div class="grid">${items.map(cardHTML).join('')}</div>`;
  } else if (q) {
    $('collection').innerHTML = `<p class="empty">Aucun ${label} ne correspond à ta recherche.</p>`;
  } else {
    $('collection').innerHTML = `<p class="empty">Aucun${tab === 'tv' ? 'e' : ''} ${label} pour l'instant.</p>`;
  }
}

$('filterText').oninput = renderCollection;
$('sortBy').onchange = () => { localStorage.setItem('sortBy', $('sortBy').value); renderCollection(); };

$('collection').onclick = async e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const { edit, del, trailer } = btn.dataset;
  if (trailer) return playTrailer(trailer);
  if (edit) {
    const item = { ...films.find(f => f.key === edit) };
    if (!item.trailer) { btn.textContent = '⏳'; item.trailer = await findTrailer(item.type || 'movie', item.id); }
    openLinkDialog(item, false);
  }
  if (del && confirm('Supprimer ?')) {
    try { await deleteDoc(doc(db, 'films', del)); }
    catch { alert('Suppression impossible.'); }
  }
};

// ---------- Lecteur bande-annonce ----------
function playTrailer(k) {
  $('player').src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(k)}?autoplay=1&rel=0`;
  $('trailerDialog').showModal();
}
$('closeTrailer').onclick = () => $('trailerDialog').close();
$('trailerDialog').addEventListener('close', () => $('player').src = '');
$('trailerDialog').onclick = e => { if (e.target === $('trailerDialog')) $('trailerDialog').close(); };

// ---------- Bandes-annonces pour la collection existante ----------
$('trailersBtn').onclick = async () => {
  if (!apiKey) return openKeyDialog();
  const todo = films.filter(f => !f.trailer);
  if (!todo.length) return alert('Tout a déjà une bande-annonce 👍');
  const btn = $('trailersBtn');
  btn.disabled = true;
  let found = 0;
  for (const [i, f] of todo.entries()) {
    btn.textContent = `⏳ ${i + 1}/${todo.length}`;
    const t = await findTrailer(f.type || 'movie', f.id);
    if (t) {
      try { await setDoc(doc(db, 'films', f.key), { trailer: t }, { merge: true }); found++; } catch {}
    }
  }
  btn.disabled = false;
  btn.textContent = '🎞️ Bandes-annonces';
  alert(`${found} bande(s)-annonce(s) ajoutée(s) sur ${todo.length}.`);
};

// ---------- Fenêtre lien ----------
function openLinkDialog(item, newItem) {
  current = item; isNew = newItem;
  $('dlgTitle').textContent = item.title;
  $('linkUrl').value = item.link || '';
  $('linkLabel').value = item.label || '';
  $('trailerUrl').value = item.trailer ? 'https://www.youtube.com/watch?v=' + item.trailer : '';
  $('linkDialog').showModal();
}

$('linkForm').onsubmit = async e => {
  e.preventDefault();
  const url = $('linkUrl').value.trim();
  if (url && !/^https?:\/\//i.test(url)) return alert('Le lien doit commencer par http:// ou https://');
  const t = ytKey($('trailerUrl').value);
  if (t === null) return alert('Lien YouTube de la bande-annonce invalide.');
  current.link = url;
  current.label = $('linkLabel').value.trim();
  current.trailer = t;
  if (isNew) current.addedAt = Date.now();
  const { key, ...data } = current;
  try {
    await setDoc(doc(db, 'films', key), data, { merge: true });
    $('linkDialog').close();
    // Bascule sur le bon onglet après un ajout
    if (isNew) { tab = data.type === 'tv' ? 'tv' : 'movie'; localStorage.setItem('tab', tab); renderCollection(); }
  } catch { alert('Enregistrement impossible.'); }
};
$('cancelLink').onclick = () => $('linkDialog').close();

// ---------- Clé API ----------
function openKeyDialog() { $('keyInput').value = apiKey; $('keyDialog').showModal(); }
$('keyBtn').onclick = openKeyDialog;
$('cancelKey').onclick = () => $('keyDialog').close();
$('keyForm').onsubmit = e => {
  e.preventDefault();
  apiKey = $('keyInput').value.trim();
  localStorage.setItem('tmdbKey', apiKey);
  $('keyDialog').close();
};
</script>
</body>
</html>
