<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Vidéothèque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#050506;--card:#16181d;--txt:#f2f2f2;--muted:#8d9096;--line:#26282d;--accent:#01b4e4;--danger:#e5484d;
        --display:'Archivo Black',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt)}
  .hidden{display:none!important}
  input,button,select{font:inherit;border-radius:8px;border:1px solid #333;padding:8px 12px;background:#1b1d22;color:var(--txt)}
  button{cursor:pointer;background:var(--accent);border:none;color:#000;font-weight:600}
  button:disabled{opacity:.6;cursor:default}
  button.secondary{background:#2a2d34;color:var(--txt)}
  button.danger{background:var(--danger);color:#fff}

  /* Connexion */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{background:var(--card);padding:28px;border-radius:14px;width:min(360px,100%);display:flex;flex-direction:column;gap:16px}
  .box h1{margin:0;text-align:center;font-size:1.4rem;font-family:var(--display);text-transform:uppercase}
  .box form{display:flex;flex-direction:column;gap:10px}
  .box label{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
  details summary{cursor:pointer;color:var(--muted);font-size:.85rem;margin-bottom:10px}
  .error{color:var(--danger);text-align:center;min-height:1.2em;margin:0;font-size:.9rem}

  /* En-tête */
  header{padding:14px 24px;background:#000;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10}
  header h1{font-size:1.2rem;margin:0 auto 0 0;font-family:var(--display);text-transform:uppercase}
  #searchForm{display:flex;gap:8px;flex-wrap:wrap}
  #yearInput{width:90px}
  main{padding:24px 40px}

  /* Petite barre de recherche à gauche */
  .toolbar{margin-bottom:8px}
  #filterText{width:240px;max-width:100%;padding:7px 12px;font-size:.9rem;font-family:var(--mono)}

  /* Sections */
  .group{margin-bottom:40px}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;
                border-top:1px solid var(--line);padding-top:28px;margin-bottom:24px}
  .sec-title{font-family:var(--display);text-transform:uppercase;font-size:clamp(1.3rem,3.5vw,2.1rem);
             margin:0;line-height:1.1;color:#fff}
  .seeAll{margin-left:auto;flex-shrink:0;background:none;border:none;border-bottom:2px solid #fff;border-radius:0;
          color:#fff;font-family:var(--mono);font-weight:500;text-transform:uppercase;letter-spacing:.2em;
          padding:2px 0;font-size:.95rem;white-space:nowrap}
  .seeAll:hover{color:var(--accent);border-color:var(--accent)}

  /* Grille : 6 par ligne sur PC, 3 sur tablette, 2 sur téléphone */
  .grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:22px}
  @media (max-width:1000px){.grid6{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:700px){
    main{padding:16px}
    .grid6{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .seeAll{font-size:.85rem;letter-spacing:.15em}
  }

  /* Carte */
  .card{display:flex;flex-direction:column;min-width:0}
  .poster{position:relative;border-radius:6px;overflow:hidden;background:#1b1d22;display:block;transition:transform .15s}
  .poster:hover{transform:translateY(-3px)}
  .poster img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
  .tag,.rating{position:absolute;font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em;
               border:1px solid rgba(255,255,255,.25);padding:4px 9px;font-size:.75rem;color:#fff}
  .tag{top:10px;left:10px;background:rgba(25,22,5,.85)}
  .rating{bottom:10px;right:10px;background:rgba(0,0,0,.85);letter-spacing:.05em}
  .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:12px}
  .title{font-family:var(--display);text-transform:uppercase;font-size:1rem;line-height:1.2;overflow-wrap:anywhere}
  .year{font-family:var(--mono);color:var(--muted);font-size:.85rem;flex-shrink:0}
  .genres{font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;margin-top:6px}
  .sep{border-top:1px solid var(--line);margin:10px 0 8px}
  .extras{display:flex;flex-direction:column;gap:6px}
  .trailerBtn{padding:6px;font-size:.8rem}
  .actions{display:flex;gap:6px}
  .actions button{flex:1;padding:6px;font-size:.8rem}
  .link{font-family:var(--mono);font-size:.8rem;color:var(--accent);text-decoration:none;overflow-wrap:anywhere}
  .link:hover{text-decoration:underline}
  @media (max-width:700px){
    .title{font-size:.9rem}
    .tag,.rating{font-size:.65rem;padding:3px 7px}
  }

  /* Résultats TMDB */
  .results-head{display:flex;align-items:center;gap:10px;margin:0 0 16px}
  .results-head h2{margin:0;font-family:var(--display);text-transform:uppercase;font-size:1.2rem}

  /* Fenêtres */
  dialog{background:var(--card);color:var(--txt);border:none;border-radius:12px;padding:20px;width:min(420px,90vw)}
  dialog::backdrop{background:rgba(0,0,0,.75)}
  dialog form{display:flex;flex-direction:column;gap:12px}
  dialog label{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
  #trailerDialog{width:min(900px,95vw);padding:12px}
  .video{width:100%;aspect-ratio:16/9;border:0;border-radius:8px;display:block;background:#000}
  .row{display:flex;gap:8px;justify-content:flex-end}
  .empty{color:var(--muted);font-family:var(--mono);font-size:.9rem}
  footer{padding:16px;text-align:center;color:var(--muted);font-size:.75rem}
</style>
</head>
<body>

<!-- ===== Écran de connexion ===== -->
<div id="loginScreen" class="login">
  <div class="box">
    <h1>🎬 Ma Vidéothèque</h1>
    <form id="codeForm">
      <label>Code d'accès
        <input id="code" type="password" required autocomplete="off">
      </label>
      <button>Entrer</button>
    </form>
    <details id="adminBox">
      <summary>Connexion admin</summary>
      <form id="adminForm">
        <input id="email" type="email" placeholder="E-mail" required>
        <input id="pwd" type="password" placeholder="Mot de passe" required>
        <button>Se connecter</button>
      </form>
    </details>
    <p id="loginError" class="error"></p>
  </div>
</div>

<!-- ===== Site ===== -->
<div id="app" class="hidden">
  <header>
    <h1>🎬 Ma Vidéothèque</h1>
    <form id="searchForm" class="admin">
      <select id="type">
        <option value="multi">Tout</option>
        <option value="movie">Films</option>
        <option value="tv">Séries</option>
      </select>
      <input id="query" placeholder="Ajouter depuis TMDB..." required>
      <input id="yearInput" type="number" min="1900" max="2100" placeholder="Année">
      <button>Rechercher</button>
    </form>
    <button class="secondary admin" id="updateBtn">🔄 Mettre à jour</button>
    <button class="secondary admin" id="keyBtn">⚙️ Clé API</button>
    <button class="secondary" id="logoutBtn">🚪 Déconnexion</button>
  </header>

  <main>
    <section id="resultsSection" hidden style="margin-bottom:32px">
      <div class="results-head">
        <h2>Résultats TMDB</h2>
        <button class="secondary" id="closeResults">✕ Fermer</button>
      </div>
      <div class="grid6" id="results"></div>
    </section>

    <div class="toolbar">
      <input id="filterText" type="search" placeholder="🔎 Rechercher...">
    </div>
    <div id="collection"></div>
  </main>

  <footer>Ce site utilise l'API TMDB mais n'est ni approuvé ni certifié par TMDB.</footer>
</div>

<!-- Fenêtre : lien -->
<dialog id="linkDialog">
  <form id="linkForm">
    <h3 id="dlgTitle" style="margin:0"></h3>
    <label>Lien (URL)
      <input id="linkUrl" type="url" placeholder="https://...">
    </label>
    <label>Texte du lien (optionnel)
      <input id="linkLabel" placeholder="Netflix, critique...">
    </label>
    <label>Bande-annonce YouTube (trouvée automatiquement, modifiable)
      <input id="trailerUrl" placeholder="https://www.youtube.com/watch?v=...">
    </label>
    <div class="row">
      <button type="button" class="secondary" id="cancelLink">Annuler</button>
      <button>Enregistrer</button>
    </div>
  </form>
</dialog>

<!-- Fenêtre : bande-annonce -->
<dialog id="trailerDialog">
  <iframe id="player" class="video" title="Bande-annonce"
    allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  <div class="row" style="margin-top:10px">
    <button class="secondary" id="closeTrailer">✕ Fermer</button>
  </div>
</dialog>

<!-- Fenêtre : clé API -->
<dialog id="keyDialog">
  <form id="keyForm">
    <h3 style="margin:0">Clé API TMDB</h3>
    <label>Colle ta clé API (v3) ou ton jeton d'accès (v4)
      <input id="keyInput" required>
    </label>
    <div class="row">
      <button type="button" class="secondary" id="cancelKey">Annuler</button>
      <button>Enregistrer</button>
    </div>
  </form>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCSXTITQx3oLlVT16Kk2SeACi9_G2gYLo0",
  authDomain: "cgtl-9b100.firebaseapp.com",
  projectId: "cgtl-9b100",
  storageBucket: "cgtl-9b100.firebasestorage.app",
  messagingSenderId: "996683479796",
  appId: "1:996683479796:web:cb66241265ccf93394fca1"
};

const GUEST_EMAIL = 'invite@videotheque.app';

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);

const IMG = 'https://image.tmdb.org/t/p/w500';
const NO_IMG = 'data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300"><rect width="100%" height="100%" fill="#1b1d22"/><text x="50%" y="50%" fill="#777" font-size="20" text-anchor="middle">Pas d\'image</text></svg>');

// Genres TMDB (films + séries) en français
const GENRES = {28:'Action',12:'Aventure',16:'Animation',35:'Comédie',80:'Crime',99:'Documentaire',18:'Drame',
  10751:'Familial',14:'Fantastique',36:'Histoire',27:'Horreur',10402:'Musique',9648:'Mystère',10749:'Romance',
  878:'Science-Fiction',10770:'Téléfilm',53:'Thriller',10752:'Guerre',37:'Western',
  10759:'Action & Aventure',10762:'Enfants',10763:'Actualités',10764:'Téléréalité',
  10765:'Science-Fiction & Fantastique',10766:'Feuilleton',10767:'Talk-show',10768:'Guerre & Politique'};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const poster = f => f.poster_path ? IMG + f.poster_path : NO_IMG;
const year = f => (f.release_date || '').slice(0, 4);
const typeOf = f => f.type === 'tv' ? 'tv' : 'movie';
const plain = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();

const norm = (r, type) => ({
  id: r.id, type,
  title: r.title || r.name,
  poster_path: r.poster_path || null,
  release_date: r.release_date || r.first_air_date || '',
  vote: r.vote_average || 0,
  genres: (r.genre_ids || []).map(id => GENRES[id]).filter(Boolean).slice(0, 2)
});

const ytKey = s => {
  s = (s || '').trim();
  if (!s) return '';
  if (/^[\w-]{11}$/.test(s)) return s;
  const m = s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
  return m ? m[1] : null;
};

const LIMIT = 6;
const expanded = { movie: false, tv: false };

let apiKey = localStorage.getItem('tmdbKey') || '';
let films = [], lastResults = [], isAdmin = false, unsub = null;
let current = null, isNew = false;

// ===== Connexion admin visible seulement avec #admin =====
function toggleAdminBox() {
  $('adminBox').classList.toggle('hidden', location.hash !== '#admin');
}
toggleAdminBox();
window.addEventListener('hashchange', toggleAdminBox);

// ---------- Connexion ----------
$('codeForm').onsubmit = async e => {
  e.preventDefault();
  $('loginError').textContent = '';
  const code = $('code').value.trim().toLowerCase();
  try { await signInWithEmailAndPassword(auth, GUEST_EMAIL, code); }
  catch { $('loginError').textContent = 'Code incorrect.'; }
};

$('adminForm').onsubmit = async e => {
  e.preventDefault();
  $('loginError').textContent = '';
  try { await signInWithEmailAndPassword(auth, $('email').value.trim(), $('pwd').value); }
  catch { $('loginError').textContent = 'E-mail ou mot de passe incorrect.'; }
};

$('logoutBtn').onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if (unsub) { unsub(); unsub = null; }
  if (!user) {
    $('app').classList.add('hidden');
    $('loginScreen').classList.remove('hidden');
    $('code').value = ''; $('pwd').value = '';
    return;
  }
  isAdmin = user.email !== GUEST_EMAIL;
  $('loginScreen').classList.add('hidden');
  $('app').classList.remove('hidden');
  document.querySelectorAll('.admin').forEach(el => el.classList.toggle('hidden', !isAdmin));

  unsub = onSnapshot(query(collection(db, 'films'), orderBy('addedAt', 'desc')), snap => {
    films = snap.docs.map(d => ({ ...d.data(), key: d.id }));
    renderCollection();
    if (!$('resultsSection').hidden) renderResults();
  }, err => {
    alert("Accès refusé. Ce compte n'est pas autorisé.");
    signOut(auth);
  });
});

// ---------- API TMDB ----------
async function tmdb(path, params = {}) {
  const url = new URL('https://api.themoviedb.org/3' + path);
  const opts = { headers: {} };
  if (apiKey.startsWith('eyJ')) opts.headers.Authorization = 'Bearer ' + apiKey;
  else url.searchParams.set('api_key', apiKey);
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(r.status === 401 ? 'Clé API invalide.' : 'Erreur TMDB ' + r.status);
  return r.json();
}

async function findTrailer(type, id) {
  if (!apiKey) return '';
  for (const lang of ['fr-FR', 'en-US']) {
    try {
      const vids = (await tmdb(`/${type}/${id}/videos`, { language: lang })).results
        .filter(v => v.site === 'YouTube');
      const pick = vids.find(v => v.type === 'Trailer' && v.official)
                || vids.find(v => v.type === 'Trailer')
                || vids.find(v => v.type === 'Teaser')
                || vids[0];
      if (pick) return pick.key;
    } catch {}
  }
  return '';
}

$('searchForm').onsubmit = async e => {
  e.preventDefault();
  if (!apiKey) return openKeyDialog();
  const type = $('type').value;
  const y = $('yearInput').value.trim();
  const params = { query: $('query').value.trim(), language: 'fr-FR' };
  try {
    if (type === 'movie') {
      if (y) params.primary_release_year = y;
      lastResults = (await tmdb('/search/movie', params)).results.map(r => norm(r, 'movie'));
    } else if (type === 'tv') {
      if (y) params.first_air_date_year = y;
      lastResults = (await tmdb('/search/tv', params)).results.map(r => norm(r, 'tv'));
    } else {
      lastResults = (await tmdb('/search/multi', params)).results
        .filter(r => r.media_type === 'movie' || r.media_type === 'tv')
        .map(r => norm(r, r.media_type));
      if (y) lastResults = lastResults.filter(r => year(r) === y);
    }
    renderResults();
  } catch (err) { alert(err.message); }
};

const isOwned = r => films.some(x => typeOf(x) === r.type && x.id === r.id);

// ---------- Morceaux de carte ----------
const tagHTML = f => `<span class="tag">${typeOf(f) === 'tv' ? 'Série' : 'Film'}</span>`;
const ratingHTML = f => f.vote ? `<span class="rating">⭐ TMDB ${Number(f.vote).toFixed(1)}/10</span>` : '';
const headHTML = f => `
  <div class="head">
    <div class="title">${esc(f.title)}</div>
    <div class="year">${year(f)}</div>
  </div>
  ${f.genres?.length ? `<div class="genres">${f.genres.map(esc).join(' · ')}</div>` : ''}`;

function renderResults() {
  $('resultsSection').hidden = false;
  $('results').innerHTML = lastResults.length ? lastResults.map((f, i) => {
    const owned = isOwned(f);
    return `<div class="card">
      <div class="poster"><img src="${poster(f)}" alt="${esc(f.title)}" loading="lazy">${tagHTML(f)}${ratingHTML(f)}</div>
      ${headHTML(f)}
      <div class="sep"></div>
      <div class="actions">
        <button data-add="${i}" ${owned ? 'disabled' : ''}>${owned ? '✓ Ajouté' : '+ Ajouter'}</button>
      </div>
    </div>`;
  }).join('') : '<p class="empty">Aucun résultat. Essaie sans l\'année, avec le titre original, ou change Films/Séries.</p>';
}

$('results').onclick = async e => {
  const btn = e.target.closest('button[data-add]');
  if (!btn) return;
  const f = lastResults[btn.dataset.add];
  btn.disabled = true; btn.textContent = '⏳ ...';
  const trailer = await findTrailer(f.type, f.id);
  btn.disabled = false; btn.textContent = '+ Ajouter';
  openLinkDialog({ ...f, key: `${f.type}-${f.id}`, link: '', label: '', trailer }, true);
};
$('closeResults').onclick = () => $('resultsSection').hidden = true;

// ---------- Collection ----------
function cardHTML(f) {
  const inner = `<img src="${poster(f)}" alt="${esc(f.title)}" loading="lazy">${tagHTML(f)}${ratingHTML(f)}`;
  return `<div class="card">
    ${f.link ? `<a class="poster" href="${esc(f.link)}" target="_blank" rel="noopener">${inner}</a>`
             : `<div class="poster">${inner}</div>`}
    ${headHTML(f)}
    <div class="sep"></div>
    <div class="extras">
      ${f.trailer ? `<button class="secondary trailerBtn" data-trailer="${esc(f.trailer)}">▶ Bande-annonce</button>` : ''}
      ${f.link ? `<a class="link" href="${esc(f.link)}" target="_blank" rel="noopener">🔗 ${esc(f.label || 'Ouvrir le lien')}</a>` : ''}
      ${isAdmin ? `<div class="actions">
        <button class="secondary" data-edit="${esc(f.key)}">✏️ Modifier</button>
        <button class="danger" data-del="${esc(f.key)}">🗑️</button>
      </div>` : ''}
    </div>
  </div>`;
}

function sectionTitle(type, count, open, searching) {
  const tv = type === 'tv';
  if (searching) return tv ? `Séries (${count})` : `Films (${count})`;
  if (open) return tv ? 'Toutes les séries' : 'Tous les films';
  const n = Math.min(LIMIT, count);
  if (n <= 1) return tv ? 'La dernière série' : 'Le dernier film';
  return tv ? `Les ${n} dernières séries` : `Les ${n} derniers films`;
}

function renderCollection() {
  if (!films.length) {
    $('collection').innerHTML = '<p class="empty">La collection est vide.</p>';
    return;
  }
  const q = plain($('filterText').value);
  // Toujours les derniers ajouts en premier
  const list = films.filter(f => !q || plain(f.title).includes(q))
                    .sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));

  const groups = [
    { type: 'movie', items: list.filter(f => typeOf(f) === 'movie') },
    { type: 'tv',    items: list.filter(f => typeOf(f) === 'tv') }
  ];

  const html = groups.map(g => {
    if (!g.items.length) return q ? '' : '';
    const open = expanded[g.type] || !!q;
    const shown = open ? g.items : g.items.slice(0, LIMIT);
    const toggle = q ? '' :
      `<button class="seeAll" data-toggle="${g.type}">${expanded[g.type] ? 'Voir moins ↑' : 'Voir tout →'}</button>`;
    return `<section class="group" id="group-${g.type}">
      <div class="section-head">
        <h2 class="sec-title">${sectionTitle(g.type, g.items.length, expanded[g.type], !!q)}</h2>
        ${toggle}
      </div>
      <div class="grid6">${shown.map(cardHTML).join('')}</div>
    </section>`;
  }).join('');

  $('collection').innerHTML = html || '<p class="empty">Aucun résultat pour cette recherche.</p>';
}

$('filterText').oninput = renderCollection;

$('collection').onclick = async e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const { edit, del, trailer, toggle } = btn.dataset;
  if (toggle) {
    expanded[toggle] = !expanded[toggle];
    renderCollection();
    $('group-' + toggle)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  if (trailer) return playTrailer(trailer);
  if (edit) {
    const item = { ...films.find(f => f.key === edit) };
    if (!item.trailer) { btn.textContent = '⏳'; item.trailer = await findTrailer(typeOf(item), item.id); }
    openLinkDialog(item, false);
  }
  if (del && confirm('Supprimer ?')) {
    try { await deleteDoc(doc(db, 'films', del)); }
    catch { alert('Suppression impossible.'); }
  }
};

// ---------- Lecteur bande-annonce ----------
function playTrailer(k) {
  $('player').src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(k)}?autoplay=1&rel=0`;
  $('trailerDialog').showModal();
}
$('closeTrailer').onclick = () => $('trailerDialog').close();
$('trailerDialog').addEventListener('close', () => $('player').src = '');
$('trailerDialog').onclick = e => { if (e.target === $('trailerDialog')) $('trailerDialog').close(); };

// ---------- Mettre à jour : note, genres, bande-annonce des anciens titres ----------
$('updateBtn').onclick = async () => {
  if (!apiKey) return openKeyDialog();
  const todo = films.filter(f => !f.trailer || !f.genres || f.vote == null);
  if (!todo.length) return alert('Tout est déjà à jour 👍');
  const btn = $('updateBtn');
  btn.disabled = true;
  let done = 0;
  for (const [i, f] of todo.entries()) {
    btn.textContent = `⏳ ${i + 1}/${todo.length}`;
    const type = typeOf(f);
    const patch = { type };
    try {
      const d = await tmdb(`/${type}/${f.id}`, { language: 'fr-FR' });
      patch.vote = d.vote_average || 0;
      patch.genres = (d.genres || []).slice(0, 2).map(g => g.name);
    } catch {}
    if (!f.trailer) {
      const t = await findTrailer(type, f.id);
      if (t) patch.trailer = t;
    }
    try { await setDoc(doc(db, 'films', f.key), patch, { merge: true }); done++; } catch {}
  }
  btn.disabled = false;
  btn.textContent = '🔄 Mettre à jour';
  alert(`${done} titre(s) mis à jour sur ${todo.length}.`);
};

// ---------- Fenêtre lien ----------
function openLinkDialog(item, newItem) {
  current = item; isNew = newItem;
  $('dlgTitle').textContent = item.title;
  $('linkUrl').value = item.link || '';
  $('linkLabel').value = item.label || '';
  $('trailerUrl').value = item.trailer ? 'https://www.youtube.com/watch?v=' + item.trailer : '';
  $('linkDialog').showModal();
}

$('linkForm').onsubmit = async e => {
  e.preventDefault();
  const url = $('linkUrl').value.trim();
  if (url && !/^https?:\/\//i.test(url)) return alert('Le lien doit commencer par http:// ou https://');
  const t = ytKey($('trailerUrl').value);
  if (t === null) return alert('Lien YouTube de la bande-annonce invalide.');
  current.link = url;
  current.label = $('linkLabel').value.trim();
  current.trailer = t;
  if (isNew) current.addedAt = Date.now();
  const { key, ...data } = current;
  try {
    await setDoc(doc(db, 'films', key), data, { merge: true });
    $('linkDialog').close();
  } catch { alert('Enregistrement impossible.'); }
};
$('cancelLink').onclick = () => $('linkDialog').close();

// ---------- Clé API ----------
function openKeyDialog() { $('keyInput').value = apiKey; $('keyDialog').showModal(); }
$('keyBtn').onclick = openKeyDialog;
$('cancelKey').onclick = () => $('keyDialog').close();
$('keyForm').onsubmit = e => {
  e.preventDefault();
  apiKey = $('keyInput').value.trim();
  localStorage.setItem('tmdbKey', apiKey);
  $('keyDialog').close();
};
</script>
